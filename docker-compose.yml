name: dast

services:

  # --------------------------------------------------------------------------
  # dast-app: the DAST framework scanner. Run with `docker compose run`.
  # --------------------------------------------------------------------------
  dast-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: dast:latest
    # All scanner knobs (depth, payloads, concurrency, timeouts, auth) are
    # passed through ONLY when the host environment defines them.  When a
    # variable is unset on the host the corresponding env var is NOT injected
    # into the container, so Pydantic Settings defaults in src/core/config.py
    # remain the single source of truth.  TARGET_URL and OUTPUT_DIR are kept
    # explicit because they are mandatory or container-specific.
    environment:
      - TARGET_URL=${TARGET_URL:-http://dvwa}
      - OUTPUT_DIR=/app/reports
      # Tuning knobs — host-controlled overrides (CLI flags also win over these)
      - LOG_LEVEL
      - MAX_DEPTH
      - MAX_PAGES
      - REQUEST_TIMEOUT
      - CONCURRENT_PAGES
      - CONCURRENT_VECTORS
      - CONCURRENT_PAYLOADS
      - REQUESTS_PER_SECOND
      - PAYLOAD_TYPES
      - MAX_PAYLOADS_PER_VECTOR
      # Authentication — only takes effect when AUTH_ENABLED=true on the host
      - AUTH_ENABLED
      - AUTH_URL
      - AUTH_USERNAME
      - AUTH_PASSWORD
      - AUTH_USERNAME_FIELD
      - AUTH_PASSWORD_FIELD
      - AUTH_SUCCESS_URL
      # DVWA test fixture (consumed by integration helpers, not the scanner)
      - DVWA_SECURITY_LEVEL
      - DVWA_USERNAME
      - DVWA_PASSWORD
    volumes:
      - ./reports:/app/reports
    networks:
      - dast-network
    cap_add:
      - NET_ADMIN
    # dast-app is a one-shot command; do not require dvwa to be healthy at
    # compose-run time because the user may target a different application.

  # --------------------------------------------------------------------------
  # dvwa: Damn Vulnerable Web Application — default scan target.
  # --------------------------------------------------------------------------
  dvwa:
    image: ghcr.io/digininja/dvwa:latest
    ports:
      - "8080:80"
    environment:
      DB_SERVER:   db
      DB_PORT:     "3306"
      DB_DATABASE: dvwa
      DB_USERNAME: dvwa
      DB_PASSWORD: p@ssw0rd
      RECAPTCHA_PRIV_KEY: ""
      RECAPTCHA_PUB_KEY:  ""
    networks:
      - dast-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # --------------------------------------------------------------------------
  # db: MariaDB database required by DVWA.
  # --------------------------------------------------------------------------
  db:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE:      dvwa
      MYSQL_USER:          dvwa
      MYSQL_PASSWORD:      p@ssw0rd
    volumes:
      - dvwa-db-data:/var/lib/mysql
    networks:
      - dast-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "dvwa", "-pp@ssw0rd"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  dast-network:
    driver: bridge

volumes:
  dvwa-db-data:
