# Aggressive scan profile
# Deep crawl with maximum payload coverage. Expect higher noise and longer run times.
max_depth: 5
max_pages: 500
request_timeout: 60
concurrent_pages: 10
max_payloads_per_vector: 200
headless: true
follow_redirects: true
payload_types: "sqli,xss,cmdi,ssrf,xxe,deserialization,path_traversal,open_redirect"
concurrent_vectors: 10
concurrent_payloads: 20
requests_per_second: 0
# Aggressive profiles run on networks where transient errors do happen and
# we want maximum coverage; 3 attempts is a fair compromise.
scanner_http_retries: 3
# 200 payloads × 60 s timeout would dominate runtime — cap aggressively.
scanner_vector_timeout_seconds: 300
