# Default scan profile
# Balanced settings suitable for standard penetration testing.
max_depth: 3
max_pages: 100
request_timeout: 30
concurrent_pages: 5
max_payloads_per_vector: 50
headless: true
follow_redirects: true
payload_types: "sqli,xss,cmdi,ssrf,xxe,deserialization,path_traversal,open_redirect"
concurrent_vectors: 5
concurrent_payloads: 10
requests_per_second: 0
# No HTTP retries on the fuzz path: a payload that times out is a signal,
# not a transient error to mask away.
scanner_http_retries: 1
# Hard cap per (vector × scanner).  Beyond this the scanner is cancelled and
# its partial findings are kept.  Two minutes is generous for the default
# profile (50 payloads × 30 s would be 25 min worst-case without abort).
scanner_vector_timeout_seconds: 120
