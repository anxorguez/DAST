# Stealth scan profile
# Minimal footprint with reduced concurrency and payload count.
# Suitable for rate-limited or heavily monitored targets.
max_depth: 2
max_pages: 50
request_timeout: 15
concurrent_pages: 2
max_payloads_per_vector: 20
headless: true
follow_redirects: true
payload_types: "sqli,xss,cmdi,ssrf,xxe,deserialization,path_traversal,open_redirect"
concurrent_vectors: 2
concurrent_payloads: 3
requests_per_second: 5
