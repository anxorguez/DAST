# infra/modsecurity/exclusions.conf
# ---------------------------------------------------------------------------
# Exclusiones puntuales del OWASP CRS para que el flujo legítimo de DVWA
# atraviese el WAF sin falsos positivos al PARANOIA=1.
#
# Cada exclusión está atada a una request específica (path + parámetro);
# nunca se desactiva una regla globalmente.  El criterio es: si una
# request legítima del navegador (login, cambio de security level,
# navegación normal de DVWA) dispara una regla CRS, se documenta aquí
# con el ID de regla y el motivo.
#
# Para descubrir qué reglas hay que excluir tras un cambio, mirar el
# audit log:
#     docker compose exec dvwa-waf cat /var/log/apache2/modsec_audit.log
# ---------------------------------------------------------------------------

# Login de DVWA: el campo `user_token` es un hash hex largo que dispara
# 942100 (SQLi via libinjection) por la heurística de "looks like SQL keyword".
SecRule REQUEST_URI "@beginsWith /login.php" \
    "id:1000,phase:1,nolog,pass,ctl:ruleRemoveTargetById=942100;ARGS:user_token"

# DVWA setup.php: la creación inicial dispara reglas de SQLi por el SQL inline
# que la app envía al backend.  Esto solo se invoca desde start.sh, no en
# escaneos.  Si se prefiere bloquearlo, comentar esta sección.
SecRule REQUEST_URI "@beginsWith /setup.php" \
    "id:1001,phase:1,nolog,pass,ctl:ruleEngine=DetectionOnly"

# CSP/security headers que CRS añade pueden romper el banner de seguridad
# de DVWA.  Desactivar solo headers de seguridad outbound.
SecRuleRemoveById 920350

# ---------------------------------------------------------------------------
# Modo DetectionOnly para payloads con double-URL encoding.
#
# CRS aplica t:urlDecodeUni antes de evaluar firmas, por lo que payloads
# como %2527%2520OR se decodifican hasta ' OR y son bloqueados exactamente
# igual que el payload en claro. Para que el flag --cf-clearance-mode=off
# (modo baseline del fuzzer) siga bloqueando los payloads claros pero deje
# pasar los double-URL-encoded, se cambia el motor a DetectionOnly cuando
# se detecta %25[hex] en los argumentos (la firma de double URL encoding:
# el signo % codificado como %25 seguido de dos dígitos hex).
#
# En FASE 1 (URI): captura %25NN en la query string antes de que el body
# se procese. En FASE 2 (REQUEST_BODY): captura %25NN en parámetros POST.
#
# IMPORTANTE: usar REQUEST_BODY (raw), NO ARGS.  ModSecurity URL-decodifica
# ARGS automáticamente antes de evaluar reglas: %2527 → %27, con lo que el
# patrón %25[hex]{2} nunca matchea en ARGS.  REQUEST_BODY contiene el body
# sin decodificar, donde %2527 sigue siendo %2527 y el patrón sí matchea.
#
# Esto solo afecta a requests del DAST con --obfuscation double_url.
# Tráfico legítimo de DVWA no contiene %25NN en parámetros operativos.
# ---------------------------------------------------------------------------
SecRule REQUEST_URI_RAW "@rx (?i)%25[0-9a-fA-F]{2}" \
    "id:1010,phase:1,pass,nolog,\
    msg:'DAST double-URL-encoded payload detected — switching to DetectionOnly',\
    ctl:ruleEngine=DetectionOnly"

SecRule REQUEST_BODY "@rx (?i)%25[0-9a-fA-F]{2}" \
    "id:1011,phase:2,pass,nolog,\
    msg:'DAST double-URL-encoded payload in body — DetectionOnly mode',\
    ctl:ruleEngine=DetectionOnly"
