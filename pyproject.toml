[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "dast-framework"
version = "0.1.0"
description = "Dynamic Application Security Testing framework for injection vulnerability detection"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.42.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "httpx>=0.27.0",
    "tenacity>=8.2.0",
    "aiosqlite>=0.20.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "loguru>=0.7.0",
    "jinja2>=3.1.0",
    "click>=8.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "S",   # bandit security rules
    "UP",  # pyupgrade
]
ignore = [
    "S101",  # assert allowed in tests
    "S105",  # field names like "password" are not hardcoded secrets
    "S110",  # try-except-pass is intentional for optional Playwright states
    "S311",  # random is fine for non-crypto use
    "S501",  # verify=False is intentional; DAST scans self-signed-cert targets
    "S603",  # subprocess without shell=True
    "S607",  # starting a process with a partial path
    "B008",  # function calls in default args (common in Click)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["^tests/", "^build/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (require DVWA running)",
    "slow: marks tests as slow running",
    "unit: marks tests as unit tests",
]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "src/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "raise NotImplementedError",
]
